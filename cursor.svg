<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 450 50'
    style='background-color: #00000000;'
    width='450px' height='50px'>

  <style>
    .prompt {
      fill: #22c55e;
      font-weight: 700;
    }
    .text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      letter-spacing: normal;
      dominant-baseline: auto;
    }
    .text-content {
      fill: #0f172a;
    }
    .cursor {
      fill: #22c55e;
    }
    @media (prefers-color-scheme: dark) {
      .text-content {
        fill: #f8fafc;
      }
    }
  </style>

  <!-- Line 1: Full-Stack Web Developer -->
  <path id='path0'>
    <animate id='d0' attributeName='d' begin='0s;d1.end'
      dur='5500ms' fill='remove'
      values='m0,32 h0 ; m0,32 h450 ; m0,32 h450 ; m0,32 h0'
      keyTimes='0; 0.55; 0.85; 1' />
  </path>
  <text class='text text-content' x='0' text-anchor='start'>
    <textPath xlink:href='#path0'>
      <tspan class='prompt'>$ </tspan>Full-Stack Web Developer <tspan class='cursor'><animate attributeName='opacity' values='1;1;0;0' keyTimes='0;0.5;0.51;1' dur='0.8s' repeatCount='indefinite'/>█</tspan>
    </textPath>
  </text>

  <!-- Line 2: Linux Enthusiast -->
  <path id='path1'>
    <animate id='d1' attributeName='d' begin='d0.end'
      dur='5500ms' fill='remove'
      values='m0,32 h0 ; m0,32 h450 ; m0,32 h450 ; m0,32 h0'
      keyTimes='0; 0.55; 0.85; 1' />
  </path>
  <text class='text text-content' x='0' text-anchor='start'>
    <textPath xlink:href='#path1'>
      <tspan class='prompt'>$ </tspan>Linux Enthusiast <tspan class='cursor'><animate attributeName='opacity' values='1;1;0;0' keyTimes='0;0.5;0.51;1' dur='0.8s' repeatCount='indefinite'/>█</tspan>
    </textPath>
  </text>
</svg>